name: metricas
on:
  push:
    branches: [main]
    paths: ['builds/**', 'progressoes/**', 'dh/**', 'tests/**']
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Recalcular todas as builds (--forcar), mesmo as que estão em cache'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy pytest
      - run: python -m dh expandir
      - run: python -m dh validar 'builds/*.json'
      - run: python -m pytest -q
      - run: python -m dh completo 'builds/*.json' ${{ inputs.forcar && '--forcar' || '' }}
      - run: |
          { echo '# Painel (gerado automaticamente)'; echo; echo '```'; python -m dh painel; echo; python -m dh painel dia_longo; echo '```'; } > PAINEL.md
      - run: python -m dh site
      - run: |
          git config user.name "dh-bot"; git config user.email "dh-bot@users.noreply.github.com"
          git add builds resultados cache PAINEL.md docs
          git diff --cached --quiet || (git commit -m "resultados: atualização automática [skip ci]" && git push)
