[project]
name = "dh-metricas"
version = "0.1.0"
description = "Motores de métricas de builds de D&D 5e (2014) — DragonHeist"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
teste = ["pytest"]

[project.scripts]
dh = "dh.cli:main"

[tool.setuptools]
packages = ["dh", "dh.controle"]

[tool.setuptools.package-data]
"dh.controle" = ["magias.json"]
"dh" = ["site.html"]
